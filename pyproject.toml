[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ticket-operations-agent"
version = "0.1.0"
description = "企业级智能工单/售后运营 Agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
# 代码以 `from src.xxx import ...` 方式导入，因此包根是项目根目录，
# 需要把 src 当作包（src/__init__.py 存在）一起打包。
# 原配置 where=["src"] 会把 agent/domain/... 当成顶层包，pip install . 会打出坏包。
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
